name: Windows training persistence diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  training:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install 'numpy<2' torch==2.2.2
      - run: cargo build --manifest-path model-maven/Cargo.toml --release --locked
      - run: python model-maven/scripts/verify_candidate_model.py model-maven/target/release/m-model.exe model-maven/candidate-fixtures/trainable-graph.json model-maven/candidate-fixtures/dual-input.csv
