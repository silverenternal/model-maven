name: Candidate upgrade and rollback diagnostic
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
          - {runner: macos-15, arch: arm64}
          - {runner: windows-2025, arch: x64}
          - {runner: windows-11-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
          run-id: 45848198756
          github-token: ${{ github.token }}
      - name: Upgrade and roll back an isolated installation
        env:
          MM_TARGET_ARCH: ${{ matrix.arch }}
        run: python model-maven/scripts/verify_candidate_upgrade.py release
