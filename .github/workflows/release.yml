name: Windows installed TUI authoring diagnostic
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  authoring:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, arch: x64}
          - {runner: windows-11-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install 'numpy<2' torch==2.2.2 pywinpty==3.1.2 pyte==0.8.2
      - run: python model-maven-tui/scripts/fetch_windows_neovim.py
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
          run-id: 45848198756
          github-token: ${{ github.token }}
      - name: Install candidate and author a model in the TUI
        env:
          MM_TARGET_ARCH: ${{ matrix.arch }}
        run: python model-maven/scripts/verify_candidate_npm_authoring.py release
