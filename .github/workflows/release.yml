name: Unix installed TUI authoring diagnostic
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  authoring:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
          - {runner: macos-15, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Install diagnostic dependencies
        shell: bash
        run: |
          python -m pip install 'numpy<2' pyte==0.8.2 ptyprocess==0.7.0
          if [[ '${{ matrix.runner }}' == 'ubuntu-24.04' ]]; then
            python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch==2.2.2
          fi
      - run: python model-maven/scripts/fetch_unix_neovim.py
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
          run-id: 45848198756
          github-token: ${{ github.token }}
      - name: Install candidate and author a model in the TUI
        env:
          MM_TARGET_ARCH: ${{ matrix.arch }}
          TERM: xterm-256color
        run: python model-maven/scripts/verify_candidate_npm_authoring.py release
