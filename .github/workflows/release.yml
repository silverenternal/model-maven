name: Windows terminal diagnostic
on: workflow_dispatch
jobs:
  preview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python model-maven-tui/scripts/fetch_windows_neovim.py
      - name: Check basic terminal output
        shell: pwsh
        run: '& $env:MM_CI_NVIM --headless -u NONE -l model-maven-tui/scripts/probe_terminal.lua'
