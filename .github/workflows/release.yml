name: Publish verified alpha assets
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
          run-id: 45848198756
          github-token: ${{ github.token }}
      - name: Verify release packages and local installation
        shell: bash
        run: |
          python model-maven/scripts/verify_release_assets.py
          npm install --prefix "$RUNNER_TEMP/mm-release-smoke" --omit=optional --ignore-scripts --no-audit --no-fund ./release/silverenternal-model-maven-0.2.0-alpha.1.tgz ./release/silverenternal-model-maven-linux-x64-0.2.0-alpha.1.tgz
          "$RUNNER_TEMP/mm-release-smoke/node_modules/.bin/m-model" --version
          "$RUNNER_TEMP/mm-release-smoke/node_modules/.bin/m-model-tui" --version
      - name: Publish GitHub alpha
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.2.0-alpha.1 --repo silverenternal/model-maven --target 24f0934d6fcc6734cb9254d9ce6ce3b91a127bf1 --prerelease --title 'Model-Maven 0.2.0-alpha.1' --notes-file model-maven/ALPHA-RELEASE-NOTES.md release/*.tgz release/*.manifest.json release/SHA256SUMS
