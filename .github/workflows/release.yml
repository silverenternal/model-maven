name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, arch: x64, exe: '' }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64, exe: '' }
          - { platform: darwin-x64, runner: macos-15-intel, arch: x64, exe: '' }
          - { platform: darwin-arm64, runner: macos-15, arch: arm64, exe: '' }
          - { platform: win32-x64, runner: windows-2025, arch: x64, exe: '.exe' }
          - { platform: win32-arm64, runner: windows-11-arm, arch: arm64, exe: '.exe' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Test TUI and build binaries
        run: |
          cargo test --manifest-path model-maven-tui/Cargo.toml --locked
          cargo build --manifest-path model-maven/Cargo.toml --release --locked
          cargo build --manifest-path model-maven-tui/Cargo.toml --release --locked
      - name: Verify terminal language selection
        if: runner.os != 'Windows'
        env:
          MODEL_MAVEN_TUI_BIN: ${{ github.workspace }}/model-maven-tui/target/release/m-model-tui
        run: python model-maven-tui/scripts/verify_language_terminal.py
      - name: Package native binaries with notices
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python model-maven/scripts/collect_rust_notices.py --target "$target" --cli-source model-maven --tui-source model-maven-tui --output-dir "$RUNNER_TEMP/notices"
          python model-maven/scripts/prepare_npm_bundle.py --kind platform --platform '${{ matrix.platform }}' --cli 'model-maven/target/release/m-model${{ matrix.exe }}' --tui 'model-maven-tui/target/release/m-model-tui${{ matrix.exe }}' --third-party-notices "$RUNNER_TEMP/notices" --name '@silverenternal/model-maven' --license MIT --output-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python model-maven/scripts/prepare_npm_bundle.py --kind launcher --name '@silverenternal/model-maven' --license MIT --output-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: release/*
          if-no-files-found: error
  install-test:
    needs: [binaries, launcher]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
          - { runner: macos-15, arch: arm64 }
          - { runner: windows-2025, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - run: python model-maven/scripts/verify_npm_platforms.py release
