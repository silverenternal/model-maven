name: Installed candidate model diagnostic
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64, pyarch: x64}
          - {runner: ubuntu-24.04-arm, arch: arm64, pyarch: arm64}
          - {runner: macos-15-intel, arch: x64, pyarch: x64}
          - {runner: macos-15, arch: arm64, pyarch: arm64}
          - {runner: windows-2025, arch: x64, pyarch: x64}
          - {runner: windows-11-arm, arch: arm64, pyarch: x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.pyarch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Install CPU PyTorch for this isolated diagnostic
        shell: bash
        run: |
          python -m pip install 'numpy<2'
          if [[ '${{ matrix.runner }}' == 'ubuntu-24.04' ]]; then
            python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch==2.2.2
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
          run-id: 45848198756
          github-token: ${{ github.token }}
      - name: Install candidate and run generated graph with real CSV
        env:
          MM_TARGET_ARCH: ${{ matrix.arch }}
        run: python model-maven/scripts/verify_candidate_npm_model.py release
