name: macOS initialization diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --manifest-path model-maven-tui/Cargo.toml --locked --test diagnosis_line confirmed_project_save_is_not_interrupted_by_the_read_only_timeout -- --nocapture
