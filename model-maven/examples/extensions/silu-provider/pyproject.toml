[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-maven-silu-provider-example"
version = "0.1.0"
description = "A packaged Layer Edit Provider for Model-Maven"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "model-maven-silu-helper==0.1.0"]

[project.entry-points."model_maven.components"]
silu-provider = "model_maven_silu_provider.provider:add_silu"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_maven_silu_provider = ["__model_maven__/*.json"]
