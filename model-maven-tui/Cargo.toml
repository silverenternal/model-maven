[package]
name = "model-maven-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An interactive terminal frontend for Model-Maven"
license = "MIT"

[[bin]]
name = "m-model-tui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rust-sugiyama = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
base64 = "0.22"
flate2 = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
